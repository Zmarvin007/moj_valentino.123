<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Za tebe ❤️</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center; /* horizontalno centriranje */
            align-items: center;     /* vertikalno centriranje */
            background: url("https://images.unsplash.com/photo-1518199266791-5375a83190b7") center/cover no-repeat;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: #e63946;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 30px;
            font-size: 24px;
        }

        button {
            font-size: 18px;
            padding: 12px 25px;
            margin: 15px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        #yes {
            background: #ff4d6d;
            color: white;
        }

        #no {
            background: #adb5bd;
        }

        #message {
            margin-top: 20px;
            font-size: 22px;
            color: #d62828;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>❤️ MICIKAAAAAAA ❤️</h1>
    <h2>💘 Želite li biti moj Valentino vaša damosti? 💘</h2>

    <button id="yes">DA 💕</button>
    <button id="no">NE 😅</button>

    <div id="message">I BOLJE TI JE hihihi!!! 🥰💖</div>
</div>

<script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const message = document.getElementById("message");

    yesBtn.addEventListener("click", () => {
        message.style.display = "block";
    });

    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

        noBtn.style.position = "absolute";
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });
</script>

</body>
</html>
